name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  analyze-test:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # 迁移测试会用真实 SQLite 打开数据库文件
      - name: 安装 sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      - name: 拉取依赖
        working-directory: app
        run: flutter pub get

      - name: 静态检查
        working-directory: app
        run: flutter analyze

      - name: 单元测试
        working-directory: app
        run: flutter test

  build-apk:
    name: 构建 release APK
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      # 配置了签名 Secrets 时使用正式签名，否则回落到 debug 签名（仅用于验证构建）
      - name: 还原签名配置
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > livebetter-release.jks
            cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=livebetter-release.jks
          EOF
          fi

      - name: 拉取依赖
        working-directory: app
        run: flutter pub get

      # 应用内更新依赖 tag 与 pubspec 版本一致
      - name: 校验 tag 与版本号
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 pubspec version ${version} 不一致"
            exit 1
          fi

      - name: 构建 APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      # 打 tag 时产出带版本号的文件名，校验和文件同时包含文件名，可直接 sha256sum -c 校验
      - name: 生成校验和
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            name="LiveBetter-${GITHUB_REF_NAME}-arm64.apk"
            cp app-release.apk "$name"
            sha256sum "$name" > "$name.sha256"
          fi
          sha256sum app-release.apk > app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: livebetter-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error

  release:
    name: 发布 Release
    runs-on: ubuntu-latest
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: livebetter-apk
          path: dist

      - name: 读取版本说明
        id: notes
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: LiveBetter ${{ steps.notes.outputs.version }}
          files: |
            dist/LiveBetter-*.apk
            dist/LiveBetter-*.apk.sha256
          generate_release_notes: true
