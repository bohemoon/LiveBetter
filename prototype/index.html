<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f3">
<title>LiveBetter</title>
<link rel="stylesheet" href="assets/styles.css?v=20261123b">
</head>
<body>
  <div class="phone">
    <main id="view" class="view"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8"></circle>
          <path d="M12 8.2v4.1l2.6 1.6"></path>
        </svg>
        <span>今日</span>
      </button>
      <button class="tab" data-tab="records">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="5.5" width="16" height="14.5" rx="3"></rect>
          <path d="M4 10h16M8.5 3.5v3M15.5 3.5v3"></path>
        </svg>
        <span>记录</span>
      </button>
      <button class="tab" data-tab="mine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8.5" r="3.5"></circle>
          <path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"></path>
        </svg>
        <span>我的</span>
      </button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toast" class="toast"></div>

    <div class="lock" id="lockScreen">
      <div class="lock-inner">
        <div class="lock-logo">LB</div>
        <div class="lock-title">LiveBetter</div>
        <div class="lock-desc" id="lockDesc">输入 4 位密码解锁</div>
        <div class="lock-dots" id="lockDots"><i></i><i></i><i></i><i></i></div>
        <div class="lock-keys" id="lockKeys">
          <button data-digit="1">1</button>
          <button data-digit="2">2</button>
          <button data-digit="3">3</button>
          <button data-digit="4">4</button>
          <button data-digit="5">5</button>
          <button data-digit="6">6</button>
          <button data-digit="7">7</button>
          <button data-digit="8">8</button>
          <button data-digit="9">9</button>
          <span></span>
          <button data-digit="0">0</button>
          <button class="key-del" data-digit="del">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/app.js?v=20261123a"></script>
</body>
</html>
